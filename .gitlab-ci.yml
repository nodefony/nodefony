# CI de nodefony — générée par `nodefony create app` (GitLab).
#
# Même filet que le workflow GitHub, même doctrine : `verify` (typecheck +
# lint + tests + CONSTRUCTION + `nodefony doctor`) puis la suite e2e qui démarre
# l'application POUR DE VRAI et l'interroge en HTTP. Le fichier est inerte hors
# GitLab — les deux forges sont servies, le dépôt choisit en poussant.
#
# 🔴 La construction est DANS `verify`, pas ici : `nodefony doctor` refuse une
# application non construite, et un correctif écrit dans ce fichier seul
# laisserait `npm run verify` rouge sur le poste du développeur.

verify:
  image: node:24
  # Les branches et les demandes de fusion — jamais une étiquette, qui
  # rejouerait à l'identique la chaîne d'un commit déjà éprouvé.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  # `interruptible` REND le job annulable quand un envoi plus récent arrive —
  # c'est le projet qui décide ensuite de l'annuler (« auto-cancel redundant
  # pipelines », activé par défaut). Et la borne évite qu'un démarrage qui pend
  # mange le quota de la journée.
  interruptible: true
  timeout: 20 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    # typecheck + lint + tests + `nodefony doctor` — l'ordre du script.
    - npm run verify
    # L'application DÉMARRE et répond en HTTP : la seule preuve qui compte.
    - npm run test:e2e
