# CI de nodefony — générée par `nodefony create app` (GitLab).
#
# Même filet que le workflow GitHub, même doctrine : `verify` (typecheck +
# lint + tests + CONSTRUCTION + `nodefony doctor`) puis la suite e2e qui démarre
# l'application POUR DE VRAI et l'interroge en HTTP. Le fichier est inerte hors
# GitLab — les deux forges sont servies, le dépôt choisit en poussant.
#
# 🔴 La construction est DANS `verify`, pas ici : `nodefony doctor` refuse une
# application non construite, et un correctif écrit dans ce fichier seul
# laisserait `npm run verify` rouge sur le poste du développeur.

verify:
  image: node:24
  # Les branches et les demandes de fusion — jamais une étiquette, qui
  # rejouerait à l'identique la chaîne d'un commit déjà éprouvé.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  # `interruptible` REND le job annulable quand un envoi plus récent arrive —
  # c'est le projet qui décide ensuite de l'annuler (« auto-cancel redundant
  # pipelines », activé par défaut). Et la borne évite qu'un démarrage qui pend
  # mange le quota de la journée.
  interruptible: true
  timeout: 20 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    # typecheck, lint, format:check, env:check, test, build, `nodefony doctor` — l'ordre du script.
    - npm run verify
    # Les clés de PRODUCTION que la suite e2e exige (second facteur, webhooks,
    # signature des jetons) : sans elles, ces briques démarrent DÉSACTIVÉES.
    # GitLab n'a pas de `$GITHUB_ENV` — les lignes du script partagent un même
    # shell, l'export y vaut donc pour la suite. 🔴 Jamais `set -a && . fichier` :
    # le shell interpréterait les guillemets du jeu de clés JSON et le rendrait
    # illisible. `export "$ligne"` garde la valeur telle quelle. Le fichier est
    # retiré aussitôt : il ne doit finir dans aucun artefact.
    - npm exec -- nodefony security:secrets --env > .ci-secrets.env
    - while IFS= read -r ligne; do export "$ligne"; done < .ci-secrets.env; rm -f .ci-secrets.env
    # L'application DÉMARRE et répond en HTTP : la seule preuve qui compte.
    - npm run test:e2e

# 🔴 L'IMAGE est l'artefact qu'on PUBLIE, et le seul que rien ne regardait.
# Un secret qui y entre est public : une couche reste téléchargeable même quand
# une couche suivante efface le fichier — un `COPY` puis un `rm` donne donc une
# image où le secret est absent du système de fichiers et présent dans le
# registre. Ni le `.dockerignore` (qui filtre le contexte, pas ce que la
# construction produit) ni un `rm` dans le Dockerfile ne ferment ce chemin.
#
# Job SÉPARÉ du `verify`, et pour une raison de décor : construire une image
# demande un démon docker, que le conteneur de `verify` n'a pas.
image-check:
  # 🔴 `node:24`, et surtout PAS `docker:28` malgré les apparences. L'image
  # officielle de docker est une Alpine dont les dépôts ne servent que Node 22
  # (`nodejs`) ou 23 (`nodejs-current`) : le framework en exige 24, et le
  # démarrage y meurt sur `SyntaxError: Unexpected identifier` — une syntaxe
  # que Node 23 ne connaît pas. Mesuré, les deux. On part donc de Node et on
  # ajoute le CLIENT docker, jamais l'inverse.
  image: node:24
  # Le démon vit dans un service ; `DOCKER_HOST` l'y envoie. Le répertoire de
  # certificats est PARTAGÉ par le service, c'est lui qui les fabrique.
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  interruptible: true
  timeout: 20 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # Le CLIENT seul — le démon est le service ci-dessus. Le nom du paquet a
    # changé selon les versions de Debian : on tente les deux plutôt que de
    # parier sur celui de l'image du jour.
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends docker-cli
      || apt-get install -y -qq --no-install-recommends docker.io
  script:
    # Les architectures de l'image, variable CI/CD du projet
    # `NF_IMAGE_PLATFORMS` (ex. `linux/amd64,linux/arm64`) ; `linux/amd64` est
    # toujours éprouvée. Une valeur inconnue ARRÊTE le job en la nommant — mal
    # orthographiée, elle ferait sauter le job arm64 sans un mot.
    - |
      set -f
      for platform in $(printf '%s' "${NF_IMAGE_PLATFORMS:-}" | tr ',' ' '); do
        case "$platform" in
          linux/amd64|linux/arm64) ;;
          *) echo "NF_IMAGE_PLATFORMS : « $platform » n'est pas servie (linux/amd64, linux/arm64)"; exit 1 ;;
        esac
      done
      set +f
    - npm ci --cache .npm --prefer-offline
    # La fin, ses paquets et ses bases : variables CI/CD du projet
    # (`NF_IMAGE_TARGET`, `NF_IMAGE_PACKAGES`, `NF_IMAGE_NODE`,
    # `NF_IMAGE_RUNTIME`) ; `runtime`, aucun paquet et les bases du Dockerfile
    # par défaut.
    - >-
      docker build --target "${NF_IMAGE_TARGET:-runtime}"
      --build-arg PACKAGES="${NF_IMAGE_PACKAGES:-}"
      --build-arg NODE_IMAGE="${NF_IMAGE_NODE:-}"
      --build-arg RUNTIME_IMAGE="${NF_IMAGE_RUNTIME:-}"
      -t nodefony:ci .
    # Job arm64 (`NF_IMAGE_ARCH` posée) : l'architecture se CONSTATE sur
    # l'image, elle ne se déduit pas de l'étiquette du runner — une étiquette
    # mal posée rendrait ce job vert sur une image amd64.
    - |
      ARCH=$(docker image inspect -f '{{.Architecture}}' nodefony:ci)
      if [ -n "${NF_IMAGE_ARCH:-}" ] && [ "$ARCH" != "$NF_IMAGE_ARCH" ]; then
        echo "image construite en « $ARCH », $NF_IMAGE_ARCH attendue — le runner n'a pas cette architecture"
        exit 1
      fi
    # `nodefony image:check` lit les COUCHES et refuse par un code non nul. Un
    # contrôle qui n'a pas PU regarder (démon injoignable, couche illisible)
    # sort en 69, pas en 0 : ce job échoue alors, ce qui est voulu.
    - npm exec -- nodefony image:check nodefony:ci

# L'IMAGE en arm64 — seulement si `NF_IMAGE_PLATFORMS` nomme `linux/arm64`.
# Sans la variable, le job n'est pas créé.
#
# Un runner ARM NATIF, pas une émulation : sous QEMU, la construction et le
# démarrage se comptent en minutes, et l'émulateur peut masquer ce qui casse
# sur le vrai matériel. `saas-linux-small-arm64` est le runner arm64 de
# GitLab.com ; une instance auto-hébergée désigne le sien par la variable
# CI/CD `NF_IMAGE_ARM64_RUNNER_TAG`, qui l'emporte sur la valeur ci-dessous.
# Même construction et même contrôle que `image-check` : seule l'architecture
# change — les modules natifs s'y installent pour arm64.
image-check-arm64:
  extends: image-check
  tags:
    - $NF_IMAGE_ARM64_RUNNER_TAG
  variables:
    NF_IMAGE_ARCH: arm64
    NF_IMAGE_ARM64_RUNNER_TAG: saas-linux-small-arm64
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $NF_IMAGE_PLATFORMS =~ /linux\/arm64/
